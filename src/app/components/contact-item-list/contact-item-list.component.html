<li class="contact-item-list-container">

  <div class="contact-item-list-contact-name-mobile">
    <nz-avatar [nzSize]="60" nzIcon="user" class="contact-item-list-avatar-mobile"/>
    <span>
      {{ contact().name }} {{ contact().lastname }}
    </span>
  </div>

  <div class="contact-item-list-name-container">
    <nz-avatar [nzSize]="75" nzIcon="user" class="contact-item-list-avatar-desktop"/>
    <div class="contact-item-list-contact-divider"></div>
    <span class="">
        {{ contact().name }} {{ contact().lastname }}
      </span>
  </div>

  <button class="contact-item-list-delete-icon" nz-button nzType="primary" nzDanger (click)="deleteContactEvent()">
    <span nz-icon nzType="user-delete" nzTheme="outline"></span>
  </button>

</li>
<div class="contact-item-list-contact-divider contact-item-list-contact-divider-hidden"></div>
